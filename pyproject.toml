[project]
name = "smartalpha"
version = "0.2.0"
description = "Solana launch microstructure alpha & sniper engine: liquidity guard, orderflow entropy, turnover velocity, prove"
readme = "README.md"
authors = [{ name = "Xeron", email = "xeron2333@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "websockets>=16.0",
]

# dev tooling 用 dependency-groups(uv sync 默认安装);optional-dependencies
# 是发布 extras,uv sync 不会装 → CI 里 pytest 不存在。
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9.0",
]

[project.scripts]
smartalpha = "smartalpha.cli:main"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
